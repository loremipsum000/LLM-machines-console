global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/recording-rules.yml
  - /etc/prometheus/rules/alert-rules.yml

scrape_configs:
  - job_name: llmm-inference-core
    scrape_timeout: 20s
    honor_labels: false
    authorization:
      credentials_file: /run/secrets/llmm_prometheus_scrape_bearer
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/inference-core.json
        refresh_interval: 30s
    metric_relabel_configs:
      - action: labelkeep
        regex: __name__|job|component|status
