[auth]
disable_login_form = true
oauth_allow_insecure_email_lookup = false

[auth.anonymous]
enabled = false

[auth.basic]
enabled = false

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
auto_login = false
client_id = grafana
client_secret = $__file{/run/secrets/llmm_grafana_oidc_client_secret}
scopes = openid profile email
auth_url = $__env{LLMM_KEYCLOAK_AUTH_URL}
token_url = $__env{LLMM_KEYCLOAK_TOKEN_URL}
api_url = $__env{LLMM_KEYCLOAK_USERINFO_URL}
use_pkce = true
use_refresh_token = true
validate_id_token = true
jwk_set_url = $__env{LLMM_KEYCLOAK_JWKS_URL}
login_attribute_path = sub
role_attribute_path = contains(realm_access.roles[*], 'admin') && !contains(realm_access.roles[*], 'operator') && 'Editor' || contains(realm_access.roles[*], 'operator') && !contains(realm_access.roles[*], 'admin') && 'Viewer'
role_attribute_strict = true
skip_org_role_sync = false
allow_assign_grafana_admin = false
tls_skip_verify_insecure = false
