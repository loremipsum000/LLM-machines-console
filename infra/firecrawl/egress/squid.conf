# Firecrawl is isolated on internal networks. This proxy is its only connector.
# Network membership is enforced by the Compose source policy and release tests.

http_port 3128
visible_hostname firecrawl-egress
pid_filename /run/squid/squid.pid

acl firecrawl_clients src all

acl Safe_ports port 80
acl Safe_ports port 443
acl Connect_ports port 443
acl CONNECT method CONNECT
# POST is retained only for self-hosted search-engine compatibility. Release
# tests must remove it if the pinned engines operate with GET and HEAD alone.
acl Allowed_methods method GET HEAD POST CONNECT

# This file is generated by the system and contains one exact hostname per line.
# Leading dots and wildcards are forbidden by validate-profile.mjs.
acl allowed_destinations dstdomain "/etc/squid/allowlists/allowed-hosts.txt"

# Never permit transparent fallback to Firecrawl's hosted service.
acl blocked_hosted_service dstdomain api.firecrawl.dev

# Squid evaluates dst ACLs against resolved addresses before opening a connection.
acl blocked_v4 dst 0.0.0.0/8
acl blocked_v4 dst 10.0.0.0/8
acl blocked_v4 dst 100.64.0.0/10
acl blocked_v4 dst 127.0.0.0/8
acl blocked_v4 dst 169.254.0.0/16
acl blocked_v4 dst 172.16.0.0/12
acl blocked_v4 dst 192.0.0.0/24
acl blocked_v4 dst 192.0.2.0/24
acl blocked_v4 dst 192.31.196.0/24
acl blocked_v4 dst 192.52.193.0/24
acl blocked_v4 dst 192.88.99.0/24
acl blocked_v4 dst 192.168.0.0/16
acl blocked_v4 dst 192.175.48.0/24
acl blocked_v4 dst 198.18.0.0/15
acl blocked_v4 dst 198.51.100.0/24
acl blocked_v4 dst 203.0.113.0/24
acl blocked_v4 dst 224.0.0.0/4
acl blocked_v4 dst 240.0.0.0/4

# IPv6 remains fail-closed until equivalent admission and rebinding tests exist.
acl blocked_v6 dst ::/0

http_access deny !firecrawl_clients
http_access deny !Safe_ports
http_access deny CONNECT !Connect_ports
http_access deny !Allowed_methods
http_access deny blocked_hosted_service
http_access deny blocked_v4
http_access deny blocked_v6
http_access allow firecrawl_clients allowed_destinations
http_access deny all

request_header_access Proxy-Authorization deny all
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
reply_header_access Server deny all
follow_x_forwarded_for deny all
forwarded_for delete
via off

cache deny all
cache_mem 8 MB
maximum_object_size 0 KB
cache_dir null /tmp
coredump_dir /var/spool/squid

access_log none
cache_log /dev/null
cache_store_log none
logfile_rotate 0

shutdown_lifetime 2 seconds
