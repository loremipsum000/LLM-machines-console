[project]
name = "llm-machines-pdf-parser"
version = "0.1.0"
description = "Private OpenDataLoader PDF parser for governed corpora"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "opendataloader-pdf==2.4.7",
  "python-multipart",
  "uvicorn"
]

[project.optional-dependencies]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_parser"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.llm-machines]
tier = "t1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
